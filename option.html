<!DOCTYPE html>
<html lang="jp">
    <head>
        <meta charset="utf-8" />
        <title>設定:pnipinp</title>
    </head>
    <body>
        <h1>pnipinp 設定</h1>
        <h2>テーマ</h2>
        <div>
            <label>ダークテーマを使用する</label>
            <input type="checkbox" id="useDarkThema" value="true" switch />
        </div>
        <div>
            <label>動画をクリックで再生/一時停止</label>
            <input type="checkbox" id="clickToPlay" value="true" switch />
        </div>
        <button type="submit" id="btn">決定</button>
        <p id="output"></p>
    </body>
    <script src="./dst/option.js"></script>
</html>
